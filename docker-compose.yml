version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: terabox_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=terabox_bot

  bot:
    build: .
    container_name: terabox_bot
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
    restart: unless-stopped

volumes:
  mongodb_data:
